# Catalyst Linux's sound, as every program finds it ("default").
#
# catalyst-audio copies this to /run/catalyst-audio/asound.conf at boot
# (/etc/asound.conf leads there), adding Bluetooth headphones over the
# speaker while they are the output.
#
# Playback: any rate, format or channel count a program asks for, turned
# (plug) into the one the codec runs at; the volume (softvol, "Master" on
# the card: catalyst-audio, the control centre and the volume keys set it);
# then dmix, so several programs play at once. The codec runs at 48 kHz,
# 16-bit, stereo, in 1024-frame periods (21 ms, 47 wake-ups a second while
# something plays; 85 ms of buffer).
#
# Capture: the same 48 kHz stream, shared (dsnoop) so several programs can
# listen at once; the microphone is on the left channel, given to every
# channel a program asks for, at any rate (plug). A program asking for
# 16 kHz mono (speech) gets exactly that.
#
# The speaker's amplifier is on only while the codec is playing: a program
# that keeps the device open while it is silent keeps it on (and hissing),
# so players close it when they pause.

# By name, not number (a USB sound card could take number 0). The "!"
# replaces alsa.conf's numbers rather than clashing with them.
defaults.pcm.!card ES8389Audio
defaults.ctl.!card ES8389Audio

pcm.!default {
	type asym
	playback.pcm "catalyst_play"
	capture.pcm "catalyst_capture"
}

ctl.!default {
	type hw
	card ES8389Audio
}

pcm.catalyst_play {
	type plug
	slave.pcm "catalyst_volume"
	hint.description "Catalyst: speaker and headphones, at the system volume"
}

# Linear in decibels from -50 dB (1) to 0 dB (100); 0 is silence.
pcm.catalyst_volume {
	type softvol
	slave.pcm "catalyst_mix"
	control {
		name "Master Playback Volume"
		card ES8389Audio
	}
	min_dB -50.0
	max_dB 0.0
	resolution 101
}

pcm.catalyst_mix {
	type dmix
	ipc_key 51820
	ipc_key_add_uid false
	ipc_perm 0666
	slave {
		pcm "hw:CARD=ES8389Audio,DEV=0"
		format S16_LE
		rate 48000
		channels 2
		period_size 1024
		buffer_size 4096
	}
	bindings {
		0 0
		1 1
	}
}

pcm.catalyst_capture {
	type plug
	slave.pcm "catalyst_mic"
	hint.description "Catalyst: the microphone"
}

pcm.catalyst_mic {
	type route
	slave {
		pcm "catalyst_snoop"
		channels 2
	}
	ttable.0.0 1
	ttable.1.0 1
}

pcm.catalyst_snoop {
	type dsnoop
	ipc_key 51821
	ipc_key_add_uid false
	ipc_perm 0666
	slave {
		pcm "hw:CARD=ES8389Audio,DEV=0"
		format S16_LE
		rate 48000
		channels 2
		period_size 1024
		buffer_size 4096
	}
	bindings {
		0 0
		1 1
	}
}

# The volume control made without sound: opening this creates "Master" on
# the card (as the first sound would) so catalyst-audio can set it before
# anything plays. Same range as catalyst_volume, so both share it.
pcm.catalyst_volume_init {
	type softvol
	slave.pcm "null"
	control {
		name "Master Playback Volume"
		card ES8389Audio
	}
	min_dB -50.0
	max_dB 0.0
	resolution 101
}
