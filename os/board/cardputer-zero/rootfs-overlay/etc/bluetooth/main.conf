# BlueZ on Catalyst Linux: a source of sound for headphones and speakers.
# Started only while Bluetooth is switched on (catalyst-bluetooth). The
# handheld's name, as other devices see it, is its own (Settings > Name &
# time).

[General]
# Never left visible to everyone nearby: the handheld finds the headphones,
# not the other way round.
DiscoverableTimeout = 180
PairableTimeout = 180
# Headphones forget pairings (a reset, a battery out): pair again with
# nothing to confirm, as the first time.
JustWorksRepairing = always

[Policy]
# The radio on as soon as bluetoothd starts, and headphones reconnected if
# the link drops.
AutoEnable = true
ReconnectAttempts = 4
ReconnectIntervals = 1, 2, 4, 8
