# Loaded in this order by catalyst-early, first thing in boot, so the screen
# and keyboard come up without waiting for anything else.

# The buses everything on the board hangs off.
i2c-bcm2835
spi-bcm2835
# The bus as a device (/dev/i2c-1): the shell drives the motion sensor
# through it (small, and the sensor is started while the logo plays).
i2c-dev

# The I/O expander next: panel reset, backlight and keyboard reset are on it.
m5ioe1
pwm_bl_m5stack
panel-mipi-dbi-m
tca8418_keypad_m5stack

# The RX8130 clock, so the time is right from the first frame: dates for
# logs, and for clearing them after 30 days.
rtc-ds1307
