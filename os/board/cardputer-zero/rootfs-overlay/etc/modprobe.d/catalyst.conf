# Drivers that would load by themselves at boot and are not wanted then.
# (A blacklist only stops automatic loading; `modprobe name` still works.)

# Wi-Fi: loaded when Wi-Fi is switched on in Settings (catalyst-wifi) and
# removed when it is switched off, so an unused radio costs no memory or power.
blacklist brcmfmac

# Infrared: loaded by the Remote app, the transmitter while the app is open
# and the receiver only while a button is learned (each edge of infrared it
# sees is an interrupt), and unloaded after.
blacklist gpio_ir_tx
blacklist gpio_ir_recv

# The Pi's video-processor services and HDMI framebuffer: the panel is an SPI
# display and the camera goes through unicam, so nothing here uses them.
blacklist vchiq
blacklist bcm2708_fb
