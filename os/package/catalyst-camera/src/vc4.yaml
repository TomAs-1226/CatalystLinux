# catalyst-camera's settings for libcamera's Raspberry Pi (VC4) pipeline,
# given it through LIBCAMERA_RPI_CONFIG_FILE.
#
# No raw frame kept by the pipeline itself where the request brings one,
# and one where it does not, not the four it keeps by default: at the
# IMX219's full 3280 x 2464 those four are 39 MB, which with the ISP's frame
# and ours does not fit in the 64 MB the camera shares with the GPU, so
# every photo came out binned at 1640 x 1232 (until 1.3). The preview and a
# RAW photo hand the pipeline raw frames of their own in each request, so
# it never waits for one and keeps none of its own (min_unicam_buffers 0,
# 1.4: a RAW photo then takes no more of the pool than a JPEG one); a JPEG
# photo and the focus check bring none, and the pipeline keeps one.
{
        "version": 1.0,
        "target": "bcm2835",

        "pipeline_handler":
        {
                "min_unicam_buffers": 0,
                "min_total_unicam_buffers": 1
        }
}
