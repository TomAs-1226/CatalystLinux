# catalyst-camera's settings for libcamera's Raspberry Pi (VC4) pipeline,
# given it through LIBCAMERA_RPI_CONFIG_FILE.
#
# No raw frame kept by the pipeline itself where the request brings one,
# and one where it does not, not the four it keeps by default: at the
# IMX219's full 3280 x 2464 those four are 39 MB, which with the ISP's frame
# and ours does not fit in the 64 MB the camera shares with the GPU, so
# every photo came out binned at 1640 x 1232 (until 1.3). The preview and a
# RAW photo hand the pipeline raw frames of their own in each request, so
# it never waits for one; a JPEG photo and the focus check bring none, and
# the pipeline keeps two.
#
# Both numbers matter, and both were wrong until 1.3.1: with
# min_unicam_buffers 0 (which libcamera's own example says must be above 0)
# no photo's frame ever came, at either size, with nothing said by libcamera,
# and min_total_unicam_buffers 1 did the same. 1 and 2 take a full
# 3280 x 2464 photo in under a second; tried on a handheld, 23 November 2026,
# with the shell's own order and with a bare one. The preview keeps one raw
# frame of the pipeline's (2.5 MB binned) beside its own. Two raw frames, the
# ISP's and ours are about 45 MB at the full size, in the 128 MB pool
# (cmdline.txt's cma=).
{
        "version": 1.0,
        "target": "bcm2835",

        "pipeline_handler":
        {
                "min_unicam_buffers": 1,
                "min_total_unicam_buffers": 2
        }
}
