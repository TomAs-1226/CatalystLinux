[workspace]
resolver = "2"
members = [
    "crates/detent", "crates/bezel", "crates/nt4", "crates/apriltag", "crates/localmodel", "crates/speech", "apps/shell", "apps/play", "apps/update", "apps/flasher", "apps/ai-cli",
    # The computer companion: the handheld's service, the Windows app, and what they share.
    "crates/companion-proto", "apps/companiond", "apps/companion",
    # Claude from the handheld: the bridge Companion runs on the computer.
    "crates/claude-bridge",
    # Music's sound after the decoder (spatial, the equalizer, loudness,
    # crossfades), and the AirPods' own protocol.
    "crates/audiofx", "crates/aap",
    # Apps for the catalogue: the kit they are written with, the package
    # format and its tool, and the apps themselves.
    "crates/kit", "crates/appkg", "catalogue/hello", "catalogue/sudoku", "catalogue/battleship", "catalogue/typing", "catalogue/orbits",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
detent = { path = "crates/detent" }
bezel = { path = "crates/bezel" }
nt4 = { path = "crates/nt4" }
apriltag = { path = "crates/apriltag" }
localmodel = { path = "crates/localmodel" }
catalyst-kit = { path = "crates/kit" }
catalyst-appkg = { path = "crates/appkg" }
catalyst-companion-proto = { path = "crates/companion-proto" }
catalyst-claude-bridge = { path = "crates/claude-bridge" }
speech = { path = "crates/speech" }
audiofx = { path = "crates/audiofx" }
aap = { path = "crates/aap" }

# The device build: small, fast, no unwinding tables.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Rendering in a debug build is too slow to judge motion by; optimise the
# pixel code even while the rest stays debuggable.
[profile.dev.package.bezel]
opt-level = 3
[profile.dev.package.detent]
opt-level = 3
[profile.dev.package."*"]
opt-level = 2

# The simulator on a development PC: as fast as the device build where it
# counts, but compiled in pieces without whole-program optimisation. It
# builds several times quicker, and an older compiler that fails on the one
# large unit the device build makes (Rust 1.92 on Windows does) is not asked
# to make it. Use: cargo run --profile sim -p catalyst-shell
[profile.sim]
inherits = "release"
lto = false
codegen-units = 16
