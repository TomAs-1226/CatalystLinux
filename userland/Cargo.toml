[workspace]
resolver = "2"
members = ["crates/detent", "crates/bezel", "crates/nt4", "crates/apriltag", "crates/localmodel", "apps/shell", "apps/update", "apps/flasher", "apps/ai-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
detent = { path = "crates/detent" }
bezel = { path = "crates/bezel" }
nt4 = { path = "crates/nt4" }
apriltag = { path = "crates/apriltag" }
localmodel = { path = "crates/localmodel" }

# The device build: small, fast, no unwinding tables.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Rendering in a debug build is too slow to judge motion by; optimise the
# pixel code even while the rest stays debuggable.
[profile.dev.package.bezel]
opt-level = 3
[profile.dev.package.detent]
opt-level = 3
[profile.dev.package."*"]
opt-level = 2

# The simulator on a development PC: as fast as the device build where it
# counts, but compiled in pieces without whole-program optimisation. It
# builds several times quicker, and an older compiler that fails on the one
# large unit the device build makes (Rust 1.92 on Windows does) is not asked
# to make it. Use: cargo run --profile sim -p catalyst-shell
[profile.sim]
inherits = "release"
lto = false
codegen-units = 16
