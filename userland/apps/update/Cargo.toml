[package]
name = "catalyst-update"
description = "Catalyst Linux's system updates, as Android does them: written into the system not in use, tried once, kept only if it comes up; and the release side that makes and signs them."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde_json = "1"
# Signatures: Ed25519, pure Rust, no randomness needed to verify.
ed25519-compact = { version = "2", default-features = false }
sha2 = "0.10"
# Compression for the payloads (pure Rust backend).
flate2 = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
