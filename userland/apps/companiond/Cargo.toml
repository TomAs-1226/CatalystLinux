[package]
name = "catalyst-companiond"
description = "The handheld's side of the computer companion: found on the network or the USB cable, paired once with a code on the screen, then sign-ins, files, music, settings, updates and backups over pinned TLS."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "catalyst-companiond"
path = "src/main.rs"

[dependencies]
catalyst-companion-proto = { workspace = true }
serde_json = "1"
# The kernel's random numbers: tokens, ids, pairing sessions.
getrandom = "0.4"
# TLS 1.3 with ring's ChaCha20-Poly1305 asked for first (the A53 has no AES
# instructions); no aws-lc, which needs cmake and NASM to build.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# The self-signed certificate made when the handheld is first paired.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
