[package]
name = "catalyst-flasher"
description = "One-click Catalyst Linux: picks the newest release, writes it to an SD card, and checks every byte."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bezel = { workspace = true }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
png = "0.18"

# The window. Not on the handheld (aarch64), where this is never built.
[target.'cfg(not(target_arch = "aarch64"))'.dependencies]
minifb = { version = "0.29", default-features = false }
