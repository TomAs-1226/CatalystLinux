[package]
name = "catalyst-shell"
description = "The Catalyst Linux shell: launcher, built-in Catalyst apps, and the hand-off to external apps."
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
# The simulator packed for a computer with nothing installed (each release's
# catalyst-sim.exe): started with nothing, it opens the window with the demo
# robot; on Windows it is a windowed program, with no console of its own.
# It carries the CJK font in itself (when scripts/cjk-font.py has made it).
packed = ["bezel/embed-cjk"]

[dependencies]
bezel = { workspace = true }
detent = { workspace = true }
nt4 = { workspace = true }
apriltag = { workspace = true }
localmodel = { workspace = true }
# App packages: the app file, the catalogue's index, signatures.
catalyst-appkg = { workspace = true }
# The microphone and the speaker, speech to text and text to speech (push-to-talk).
speech = { workspace = true }
serde_json = "1"
# Checking a downloaded on-device model against its pinned sum.
sha2 = "0.10"
# Music, signed in: YouTube's request signature (SAPISIDHASH) is a SHA-1.
sha1 = "0.11"
# The lock screen's passcode, kept only as an Argon2id hash (RustCrypto's,
# pure Rust: BLAKE2b's 64-bit adds and rotations, nothing the CM0's A53
# lacks). No `rand`: the salt is read from the kernel. With `zeroize`, its
# memory is wiped once the vault's key is derived from it.
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "password-hash", "zeroize"] }
# The vault (vault/): XChaCha20-Poly1305, RustCrypto's pure Rust, fast on
# the A53 with no AES instructions; its cipher state wiped after use. No
# `alloc` or `getrandom` of its own: it seals buffers in place, and nonces
# come from `getrandom` below.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["zeroize"] }
# The kernel's random numbers (getrandom(2) on the handheld, the system's
# generator on a computer): the vault's keys, salts, nonces and passwords.
getrandom = "0.4"
# Secrets wiped from memory once used (the vault's key, its entries).
zeroize = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
vte = "0.15"
# QR codes for the setup page's address (Project Nayuki's encoder; no dependencies).
qrcodegen = "1.8"
# Screenshots, on the handheld as on a computer (and the galleries' pictures).
png = "0.18"
# QR codes read by the camera (pure Rust, no C library to build). Without
# its `img` feature: it is given the picture's brightness, not an image crate.
rqrr = { version = "0.11", default-features = false }
# Photos opened in the album, at an eighth, a quarter or half of their size
# where that is all the panel needs (scaled in the decoder, so a 3280 × 2464
# photo never needs its whole 24 MB). No thread pool.
jpeg-decoder = { version = "0.3", default-features = false }
# Music's album covers on the card (512 and 96 px), and the simulated
# camera's photos (on the handheld, catalyst-camera writes those through
# libjpeg-turbo). Pure Rust.
jpeg-encoder = "0.7"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Desktop development only: a window to run the UI in. Not built into the
# device image.
[target.'cfg(not(target_arch = "aarch64"))'.dependencies]
minifb = { version = "0.29", default-features = false }
