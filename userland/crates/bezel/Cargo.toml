[package]
name = "bezel"
description = "Bezel drawn on the CPU: tonal surfaces, type, icons and refracting glass for small framebuffers."
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
# The CJK font built into the program (the packed simulator), when
# scripts/cjk-font.py has made it: see build.rs.
embed-cjk = []

[dependencies]
swash = "0.2"

# Mapping the CJK font's file rather than reading it.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
png = "0.18"
