[package]
name = "catalyst-kit"
description = "Write apps for Catalyst Linux that look and move like its own: Bezel's surfaces, type and glass, Detent's springs, the handheld's keys, and the panel taken from the shell and given back."
version = "1.0.0"
edition.workspace = true
license.workspace = true

[lib]
name = "catalyst_kit"

# Native screens for shell scripts: `catalyst-ui menu …` and the rest.
[[bin]]
name = "catalyst-ui"
path = "src/bin/catalyst-ui.rs"

[dependencies]
bezel = { workspace = true }
detent = { workspace = true }
# The clock in the status line, in the handheld's own time zone.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# On a computer: a window to run an app in, and PNGs of its screens. Not
# built for the handheld.
[target.'cfg(not(target_arch = "aarch64"))'.dependencies]
minifb = { version = "0.29", default-features = false }
png = "0.18"
